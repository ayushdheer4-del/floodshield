# Training configuration (placeholder; nothing trained).

device: mps
fallback_device: cpu
dtype: float32

seed: 42

# PROPOSED split, NOT FINAL. Time-based split only (no random shuffling across
# time), to avoid leakage between periods.
#
# This split was chosen AFTER inspecting streamflow coverage in CAMELS-IND v2.2,
# not fixed in advance:
#   - Observed streamflow for Godavari and Mahanadi mostly ends in Feb-Mar 2019
#     (almost no data in 2020), so the test period ends 2018-12-31.
#   - Many Godavari gauges share a data gap around 2014-2015. Validation is
#     placed before it (2009-2012) and the gap falls inside the test period.
# Because the periods were picked with knowledge of data availability, report
# this alongside any test-period results.
split:
  strategy: time_based
  status: proposed
  train: {start: "1991-01-01", end: "2008-12-31"}
  validation: {start: "2009-01-01", end: "2012-12-31"}
  test: {start: "2013-01-01", end: "2018-12-31"}

loss:
  # Masked loss: days with missing observed streamflow are excluded.
  type: masked   # TODO: choose base loss (e.g. MSE / NSE-based) and document
  mask_missing_targets: true

optimizer:
  name: null           # TODO
  learning_rate: null  # TODO

batch_size: null  # TODO
epochs: null      # TODO
early_stopping:
  patience: null  # TODO

checkpoint_dir: ./checkpoints
